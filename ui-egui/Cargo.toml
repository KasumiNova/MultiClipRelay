[package]
name = "ui-egui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ui-egui"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dirs = "5"
which = "6"

# egui app framework
# Use glow backend for smaller builds than wgpu.
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Optional (nice to have) for a slightly better app icon later.
# image = { version = "0.25", default-features = false, features = ["png"] }
