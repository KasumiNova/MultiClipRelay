[package]
name = "ui-tray-win"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ui-tray-win"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
which = "6"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dirs = "5"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.19"
winit = "0.30"

# For simple Startup-folder autostart.
# (No extra deps required)
